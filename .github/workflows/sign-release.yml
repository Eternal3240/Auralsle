name: 构建并发布 Release (GitHub & Gitee)
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '发布 Tag（留空则自动读取 Cargo.toml 版本并同步到对应 Release）'
        required: false
        default: ''
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: windows-latest
    env:
      CARGO_BUILD_JOBS: 1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 读取版本号与 Tag
        id: meta
        shell: pwsh
        run: |
          $ver = [regex]::Match((Get-Content Cargo.toml -Raw), '(?m)^version = "([^"]+)"').Groups[1].Value
          $tag = if ("${{ github.event_name }}" -eq "release") {
            "${{ github.event.release.tag_name }}"
          } elseif ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}") {
            "${{ github.ref_name }}"
          } elseif ("${{ inputs.tag }}") {
            "${{ inputs.tag }}"
          } else {
            "v$ver"
          }
          "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: 安装 Rust stable
        run: rustup toolchain install stable --profile minimal
      - name: 预拉取 Cargo 依赖
        run: cargo +stable fetch --locked --target x86_64-pc-windows-msvc
      - name: 构建未签名安装包与便携版
        shell: pwsh
        run: |
          $compiler = ./scripts/get-nsis.ps1 -Directory $env:RUNNER_TEMP
          ./scripts/package.ps1 -NsisCompiler $compiler
      - name: 提取更新日志并发布 GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          VER: ${{ steps.meta.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          # GitHub Actions 把 env: 注入为进程环境变量，必须用 $env: 读取；
          # 旧版直接写 $VER / $TAG 得到空串，拼成 `AuraIsle-Setup-v-x64.exe` 导致发布步骤必失败。
          $ver = $env:VER
          $tag = $env:TAG
          if (-not $ver) { throw '环境变量 VER 为空：meta 步骤未产出 version' }
          if (-not $tag) { throw '环境变量 TAG 为空：meta 步骤未产出 tag' }

          $setup = "dist/AuraIsle-Setup-v$ver-x64.exe"
          $zip = "dist/AuraIsle-v$ver-windows-x64.zip"
          $sums = "dist/SHA256SUMS.txt"
          foreach ($p in @($setup, $zip)) {
            if (-not (Test-Path -LiteralPath $p)) { throw "缺少打包产物：$p（请检查 package.ps1 输出目录）" }
          }
          $h1 = (Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash.ToLower() + "  AuraIsle-Setup-v$ver-x64.exe"
          $h2 = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLower() + "  AuraIsle-v$ver-windows-x64.zip"
          @($h1, $h2) | Set-Content -Path $sums -Encoding utf8

          $changelog = Get-Content CHANGELOG.md -Raw -Encoding utf8
          $pattern = "(?ms)^##\s+" + [regex]::Escape($tag) + "\b.*?(?=^##\s+|\z)"
          $m = [regex]::Match($changelog, $pattern)
          $notes = if ($m.Success) { $m.Value.Trim() } else { "灵屿 AuraIsle $tag" }
          $notes | Set-Content -Path dist/release-notes.md -Encoding utf8

          $exists = $true
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) { $exists = $false }
          if ($exists) {
            gh release edit $tag --title "灵屿 AuraIsle $tag" --notes-file dist/release-notes.md
          } else {
            gh release create $tag --title "灵屿 AuraIsle $tag" --notes-file dist/release-notes.md
          }
          gh release upload $tag $setup $zip $sums --clobber
      - name: 同步代码与 Release 至 Gitee
        shell: pwsh
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_REPO: ${{ vars.GITEE_REPO || 'Tang1727/auralsle' }}
          TAG: ${{ steps.meta.outputs.tag }}
          VER: ${{ steps.meta.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:GITEE_TOKEN) {
            Write-Warning "未配置 GITEE_TOKEN Secret，已跳过同步 Gitee Release。"
            exit 0
          }
          $remote = "https://oauth2:$($env:GITEE_TOKEN)@gitee.com/$($env:GITEE_REPO).git"
          git push $remote "HEAD:refs/heads/main" "refs/tags/$($env:TAG):refs/tags/$($env:TAG)" --force
          if ($LASTEXITCODE -ne 0) { throw "推送到 Gitee 失败" }

          $notes = (Get-Content dist/release-notes.md -Raw -Encoding utf8).Trim()
          if (-not $notes) { $notes = "灵屿 AuraIsle $($env:TAG)" }
          $base = "https://gitee.com/api/v5/repos/$($env:GITEE_REPO)/releases"
          $encodedTag = [uri]::EscapeDataString($env:TAG)
          $relId = $null
          try {
            $existing = Invoke-RestMethod -Uri "$base/tags/$($encodedTag)?access_token=$($env:GITEE_TOKEN)" -Method Get
            $relId = $existing.id
          } catch {
            if ($_.Exception.Response.StatusCode.value__ -ne 404) { throw }
          }
          if (-not $relId) {
            $created = Invoke-RestMethod -Uri $base -Method Post -Body @{
              access_token = $env:GITEE_TOKEN
              tag_name = $env:TAG
              name = "灵屿 AuraIsle $($env:TAG)"
              body = $notes
              target_commitish = "main"
            }
            $relId = $created.id
          }

          $attachUrl = "$base/$relId/attach_files"
          $attachList = Invoke-RestMethod -Uri "$($attachUrl)?access_token=$($env:GITEE_TOKEN)" -Method Get
          $files = @(
            "dist/AuraIsle-Setup-v$($env:VER)-x64.exe",
            "dist/AuraIsle-v$($env:VER)-windows-x64.zip",
            "dist/SHA256SUMS.txt"
          )
          foreach ($path in $files) {
            $name = Split-Path $path -Leaf
            foreach ($item in ($attachList | Where-Object { $_.name -eq $name })) {
              Invoke-RestMethod -Uri "$attachUrl/$($item.id)?access_token=$($env:GITEE_TOKEN)" -Method Delete | Out-Null
            }
            curl.exe -fsSL -X POST -F "access_token=$($env:GITEE_TOKEN)" -F "file=@$path" $attachUrl | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "上传 $name 到 Gitee 失败" }
          }
          Write-Host "已同步发布至 Gitee Release: https://gitee.com/$($env:GITEE_REPO)/releases/tag/$($env:TAG)"
